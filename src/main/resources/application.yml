server:
  port: 8443
  ssl:
    enabled: true
    client-auth: need
    key-store: classpath:certs/gateway-keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    trust-store: classpath:certs/gateway-truststore.p12
    trust-store-password: changeit
    trust-store-type: PKCS12

spring:
  application:
    name: pop-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: mock-downstream
          uri: http://localhost:8080
          predicates:
            - Path=/**
          filters:
            - name: ContextExtraction
            - name: PolicyEnforcement

gateway:
  security:
    secret-key: "${POP_SECRET_KEY:YourSuperSecretKeyForHmacGenerationMakeItLongAndSecure}"
    # Comma-separated raw CompositePolicyKey strings (spiffeId:userId:resource:action)
    # that are allowed when Redis has no entry (static fallback allowlist).
    # Used for benchmark scenarios. In production, populate Redis via setPolicyDecision().
    policy-allowlist: >-
      spiffe://cluster.local/ns/default/sa/k6-client:benchmark-user:/api/resource/static-warm:GET,
      spiffe://cluster.local/ns/default/sa/k6-client:benchmark-user:/api/resource/stress-warm:GET,
      spiffe://cluster.local/ns/default/sa/k6-client:benchmark-user:/api/resource/dynamic-*:GET,
      spiffe://cluster.local/ns/default/sa/k6-client:benchmark-user:/api/resource/stress-*:GET
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    tags:
      application: pop-gateway
